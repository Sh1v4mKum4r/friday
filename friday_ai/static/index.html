<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --surface-01: rgba(255,255,255,0.03);
    --surface-02: rgba(255,255,255,0.05);
    --surface-03: rgba(255,255,255,0.06);
    --surface-04: rgba(255,255,255,0.08);
    --accent: #8b5cf6;
    --accent-dim: #6d28d9;
    --accent-glow: rgba(139,92,246,0.15);
    --accent-glow-strong: rgba(139,92,246,0.25);
    --text: #e8e8f0;
    --text-secondary: #6b6b8a;
    --text-muted: #44445a;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.14);
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --code-bg: #08080e;
    --sidebar-width: 240px;
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-width);
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface-01);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
    transition: transform var(--transition), width var(--transition);
    z-index: 20;
    position: relative;
  }

  .sidebar.collapsed {
    width: 0;
    transform: translateX(calc(var(--sidebar-width) * -1));
    overflow: hidden;
    border-right: none;
  }

  .sidebar-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .sidebar-logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: white;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9, #8b5cf6);
    background-size: 200% 200%;
    animation: gradientShift 3s ease infinite;
    box-shadow: 0 0 20px var(--accent-glow);
    flex-shrink: 0;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .sidebar-brand-text {
    display: flex;
    flex-direction: column;
  }

  .sidebar-brand-text h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sidebar-brand-text span {
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }

  .new-chat-btn {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface-02);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .new-chat-btn:hover {
    background: var(--surface-03);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .new-chat-btn svg {
    width: 16px;
    height: 16px;
    stroke: var(--text-secondary);
    stroke-width: 2;
    fill: none;
  }

  /* Conversation list */
  .sidebar-conversations {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .sidebar-conversations::-webkit-scrollbar { width: 3px; }
  .sidebar-conversations::-webkit-scrollbar-track { background: transparent; }
  .sidebar-conversations::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .convo-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    padding: 12px 8px 6px;
  }

  .convo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
  }

  .convo-item:hover {
    background: var(--surface-03);
    color: var(--text);
  }

  .convo-item.active {
    background: var(--accent-glow);
    color: var(--text);
    border: 1px solid rgba(139,92,246,0.2);
  }

  .convo-item .convo-delete {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all var(--transition);
  }

  .convo-item:hover .convo-delete { display: flex; }
  .convo-item .convo-delete:hover { background: rgba(239,68,68,0.15); color: var(--danger); }

  .convo-icon {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    flex-shrink: 0;
  }

  /* Sidebar status */
  .sidebar-status {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .sidebar-status-header span {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
  }

  .refresh-btn {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .refresh-btn:hover { background: var(--surface-03); color: var(--text); }
  .refresh-btn.spinning svg { animation: spin 0.6s ease; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .refresh-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  .provider-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }

  .provider-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .provider-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .provider-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .provider-name {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Sidebar toggle */
  .sidebar-toggle {
    position: absolute;
    top: 20px;
    left: 12px;
    z-index: 25;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--surface-02);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .sidebar-toggle:hover { background: var(--surface-03); color: var(--text); }

  .sidebar-toggle svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  /* ===== MAIN ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  /* ===== CHAT AREA ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-area::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 16px;
    padding: 40px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .empty-logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #8b5cf6, #6d28d9, #a855f7, #8b5cf6);
    background-size: 300% 300%;
    animation: gradientShift 4s ease infinite;
    box-shadow: 0 0 60px var(--accent-glow-strong), 0 0 120px var(--accent-glow);
    margin-bottom: 8px;
  }

  .empty-state h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-state .tagline {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 440px;
  }

  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    max-width: 560px;
  }

  .quick-chip {
    background: var(--surface-02);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-secondary);
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(10px);
  }

  .quick-chip:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-glow);
    box-shadow: 0 0 16px var(--accent-glow);
    transform: translateY(-1px);
  }

  .quick-chip .chip-icon {
    font-size: 14px;
    opacity: 0.8;
    width: 18px;
    text-align: center;
  }

  /* ===== MESSAGE GROUPS ===== */
  .msg-group {
    display: flex;
    gap: 12px;
    animation: slideIn 0.25s ease;
    max-width: 820px;
    width: 100%;
  }

  .msg-group.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-group.friday {
    align-self: flex-start;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }

  .msg-avatar.friday-av {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: white;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .msg-avatar.user-av {
    background: var(--surface-04);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
  }

  .msg-meta {
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .msg-meta .provider-tag {
    background: var(--surface-04);
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    font-weight: 600;
  }

  .bubble {
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    word-wrap: break-word;
    overflow-wrap: break-word;
    min-width: 0;
  }

  .msg-group.user .bubble {
    background: rgba(30,27,75,0.5);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    color: var(--text);
    border: 1px solid rgba(139,92,246,0.2);
    backdrop-filter: blur(10px);
  }

  .msg-group.friday .bubble {
    background: var(--surface-02);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }

  /* Markdown in bubbles */
  .bubble pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 10px 0;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    line-height: 1.6;
    position: relative;
  }

  .bubble pre::-webkit-scrollbar { height: 4px; }
  .bubble pre::-webkit-scrollbar-track { background: transparent; }
  .bubble pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    margin: -14px -16px 12px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }

  .code-lang {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    text-transform: lowercase;
  }

  .copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    padding: 2px 8px;
    border-radius: 4px;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .copy-btn:hover { background: var(--surface-03); color: var(--text); }
  .copy-btn.copied { color: var(--success); }

  .copy-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  .bubble code {
    background: var(--surface-04);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
  }

  .bubble pre code {
    background: none;
    padding: 0;
    color: var(--text);
    border-radius: 0;
  }

  .bubble strong { color: #fff; font-weight: 600; }
  .bubble em { color: #c4b5fd; font-style: italic; }

  .bubble h1, .bubble h2, .bubble h3 {
    color: #fff;
    margin: 14px 0 6px;
    font-weight: 600;
  }
  .bubble h1 { font-size: 18px; }
  .bubble h2 { font-size: 16px; }
  .bubble h3 { font-size: 15px; }

  .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
  .bubble li { margin: 4px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }

  .bubble blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--text-secondary);
  }

  /* Typing indicator */
  .thinking-group {
    display: flex;
    gap: 12px;
    align-self: flex-start;
    animation: slideIn 0.25s ease;
  }

  .thinking-dots {
    display: flex;
    gap: 5px;
    padding: 16px 18px;
    background: var(--surface-02);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    backdrop-filter: blur(10px);
  }

  .thinking-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.4s infinite;
    opacity: 0.4;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ===== INPUT AREA ===== */
  .input-area {
    padding: 0 24px 20px;
    flex-shrink: 0;
  }

  .mode-switcher {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    background: var(--surface-01);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
    width: fit-content;
  }

  .mode-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .mode-btn:hover { color: var(--text); background: var(--surface-02); }

  .mode-btn.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .mode-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
  }

  .input-container {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface-02);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 4px 4px 16px;
    transition: all var(--transition);
    backdrop-filter: blur(10px);
  }

  .input-container:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow), 0 0 20px var(--accent-glow);
  }

  .input-container textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 0;
    font-size: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 140px;
    line-height: 1.5;
  }

  .input-container textarea::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border: none;
    border-radius: 10px;
    color: white;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent-glow-strong); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

  .send-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: white;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .keyboard-hints {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    padding: 0 4px;
  }

  .keyboard-hints span {
    font-size: 11px;
    color: var(--text-muted);
  }

  .keyboard-hints kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    background: var(--surface-03);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="sidebar-logo">F</div>
      <div class="sidebar-brand-text">
        <h1>Friday</h1>
        <span>AI System Assistant</span>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newConversation()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
  </div>

  <div class="sidebar-conversations" id="convoList">
    <div class="convo-label">Conversations</div>
  </div>

  <div class="sidebar-status" id="sidebarStatus">
    <div class="sidebar-status-header">
      <span>System Status</span>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshHealth()">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
    <div id="providerList">
      <div class="provider-status">
        <div class="provider-dot offline"></div>
        <span class="provider-name">Checking...</span>
      </div>
    </div>
  </div>
</aside>

<!-- Sidebar toggle -->
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
  <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- Main content -->
<div class="main">
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-logo">F</div>
      <h2>What can I help with?</h2>
      <p class="tagline">I can run commands, manage your system, control your desktop, search the web, and delegate complex tasks to cloud AI.</p>
      <div class="quick-chips">
        <button class="quick-chip" onclick="quickSend('What is my disk space?')">
          <span class="chip-icon">&#x1F4BE;</span> Disk space
        </button>
        <button class="quick-chip" onclick="quickSend('Show my GPU temperature')">
          <span class="chip-icon">&#x1F321;</span> GPU temp
        </button>
        <button class="quick-chip" onclick="quickSend('Take a screenshot')">
          <span class="chip-icon">&#x1F4F8;</span> Screenshot
        </button>
        <button class="quick-chip" onclick="quickSend('What is my IP address?')">
          <span class="chip-icon">&#x1F310;</span> My IP
        </button>
        <button class="quick-chip" onclick="quickSend('Set brightness to 50%')">
          <span class="chip-icon">&#x2600;</span> Brightness
        </button>
        <button class="quick-chip" onclick="quickSend('Search the web for latest Arch Linux news')">
          <span class="chip-icon">&#x1F50D;</span> Web search
        </button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="chat" onclick="setMode('chat')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </button>
      <button class="mode-btn" data-mode="command" onclick="setMode('command')">
        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        Command
      </button>
      <button class="mode-btn" data-mode="search" onclick="setMode('search')">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
    </div>
    <div class="input-container">
      <textarea id="input" placeholder="Ask Friday anything..." rows="1" autofocus></textarea>
      <button class="send-btn" id="sendBtn" title="Send message">
        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div class="keyboard-hints">
      <span><kbd>Enter</kbd> send</span>
      <span><kbd>Shift+Enter</kbd> newline</span>
      <span><kbd>Ctrl+L</kbd> clear</span>
      <span><kbd>Ctrl+N</kbd> new chat</span>
    </div>
  </div>
</div>

<script>
// ===== State =====
const API = window.location.origin;
const STORAGE_KEY = 'friday_conversations';
const SIDEBAR_KEY = 'friday_sidebar_collapsed';

let conversations = loadConversations();
let activeConvoId = null;
let sending = false;
let currentMode = 'chat';

// ===== DOM refs =====
const chatArea = document.getElementById('chatArea');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const convoList = document.getElementById('convoList');

// ===== Init =====
function init() {
  // Restore sidebar state
  if (localStorage.getItem(SIDEBAR_KEY) === 'true') {
    sidebar.classList.add('collapsed');
    updateTogglePosition();
  }
  renderConvoList();
  checkHealth();
  setInterval(checkHealth, 30000);

  // If there are conversations, load the most recent
  if (conversations.length > 0) {
    loadConversation(conversations[0].id);
  }
}

// ===== LocalStorage =====
function loadConversations() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}

function getConvo(id) {
  return conversations.find(c => c.id === id);
}

// ===== Sidebar =====
function toggleSidebar() {
  sidebar.classList.toggle('collapsed');
  localStorage.setItem(SIDEBAR_KEY, sidebar.classList.contains('collapsed'));
  updateTogglePosition();
}

function updateTogglePosition() {
  if (sidebar.classList.contains('collapsed')) {
    sidebarToggle.style.left = '12px';
  } else {
    sidebarToggle.style.left = (240 + 12) + 'px';
  }
}
updateTogglePosition();

function renderConvoList() {
  const label = '<div class="convo-label">Conversations</div>';
  if (conversations.length === 0) {
    convoList.innerHTML = label + '<div style="padding:12px 10px;font-size:12px;color:var(--text-muted);">No conversations yet</div>';
    return;
  }

  let html = label;
  conversations.forEach(c => {
    const isActive = c.id === activeConvoId ? ' active' : '';
    const title = escapeHtml(c.title || 'New chat');
    html += `<div class="convo-item${isActive}" onclick="loadConversation('${c.id}')">
      <svg class="convo-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="overflow:hidden;text-overflow:ellipsis;flex:1">${title}</span>
      <button class="convo-delete" onclick="event.stopPropagation();deleteConversation('${c.id}')" title="Delete">&times;</button>
    </div>`;
  });
  convoList.innerHTML = html;
}

// ===== Conversations =====
function newConversation() {
  const convo = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    title: 'New chat',
    messages: [],
    timestamp: Date.now()
  };
  conversations.unshift(convo);
  saveConversations();
  loadConversation(convo.id);
}

function loadConversation(id) {
  activeConvoId = id;
  const convo = getConvo(id);
  if (!convo) return;

  // Render messages
  chatArea.innerHTML = '';
  if (convo.messages.length === 0) {
    chatArea.appendChild(createEmptyState());
  } else {
    convo.messages.forEach(m => {
      addMessageToDOM(m.text, m.role, m.provider, m.timestamp, false);
    });
    scrollToBottom();
  }

  renderConvoList();
  inputEl.focus();
}

function deleteConversation(id) {
  conversations = conversations.filter(c => c.id !== id);
  saveConversations();
  if (activeConvoId === id) {
    activeConvoId = null;
    chatArea.innerHTML = '';
    chatArea.appendChild(createEmptyState());
    if (conversations.length > 0) {
      loadConversation(conversations[0].id);
    }
  }
  renderConvoList();
}

function ensureActiveConvo() {
  if (!activeConvoId || !getConvo(activeConvoId)) {
    newConversation();
  }
}

// ===== Mode switcher =====
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  const placeholders = {
    chat: 'Ask Friday anything...',
    command: 'Enter a command to run...',
    search: 'What do you want to search for?'
  };
  inputEl.placeholder = placeholders[mode];
  inputEl.focus();
}

// ===== Health check =====
async function checkHealth() {
  const providerListEl = document.getElementById('providerList');
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    let html = '';
    if (data.providers && data.providers.length > 0) {
      data.providers.forEach(p => {
        const name = typeof p === 'string' ? p : (p.name || p);
        html += `<div class="provider-status">
          <div class="provider-dot online"></div>
          <span class="provider-name">${escapeHtml(String(name))}</span>
        </div>`;
      });
    } else {
      html = `<div class="provider-status">
        <div class="provider-dot online"></div>
        <span class="provider-name">System online</span>
      </div>`;
    }
    providerListEl.innerHTML = html;
  } catch {
    providerListEl.innerHTML = `<div class="provider-status">
      <div class="provider-dot offline"></div>
      <span class="provider-name">Offline</span>
    </div>`;
  }
}

function refreshHealth() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  checkHealth().finally(() => {
    setTimeout(() => btn.classList.remove('spinning'), 600);
  });
}

// ===== Input handling =====
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearChat(); }
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); newConversation(); }
});

sendBtn.addEventListener('click', send);

// ===== Send message =====
async function send() {
  let text = inputEl.value.trim();
  if (!text || sending) return;

  // Prepend mode prefix
  if (currentMode === 'command') {
    text = 'run ' + text;
  } else if (currentMode === 'search') {
    text = 'search ' + text;
  }

  ensureActiveConvo();

  // Remove empty state
  const es = document.getElementById('emptyState');
  if (es) es.remove();

  // Save and display user message
  const timestamp = Date.now();
  const convo = getConvo(activeConvoId);
  if (convo) {
    convo.messages.push({ role: 'user', text: inputEl.value.trim(), timestamp });
    // Update title from first message
    if (convo.messages.length === 1) {
      convo.title = inputEl.value.trim().slice(0, 50) + (inputEl.value.trim().length > 50 ? '...' : '');
    }
    convo.timestamp = timestamp;
    saveConversations();
    renderConvoList();
  }

  addMessageToDOM(inputEl.value.trim(), 'user', '', timestamp);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const thinking = addThinking();
  scrollToBottom();

  sending = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    thinking.remove();

    const respTime = Date.now();
    addMessageToDOM(data.response, 'friday', data.provider || '', respTime);

    // Save Friday response
    if (convo) {
      convo.messages.push({ role: 'friday', text: data.response, provider: data.provider || '', timestamp: respTime });
      convo.timestamp = respTime;
      saveConversations();
    }
  } catch (err) {
    thinking.remove();
    const errTime = Date.now();
    const errMsg = `Connection error: ${err.message}`;
    addMessageToDOM(errMsg, 'friday', 'error', errTime);

    if (convo) {
      convo.messages.push({ role: 'friday', text: errMsg, provider: 'error', timestamp: errTime });
      saveConversations();
    }
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function quickSend(text) {
  inputEl.value = text;
  send();
}

// ===== Clear chat =====
function clearChat() {
  if (activeConvoId) {
    const convo = getConvo(activeConvoId);
    if (convo) {
      convo.messages = [];
      convo.title = 'New chat';
      saveConversations();
      renderConvoList();
    }
  }
  chatArea.innerHTML = '';
  chatArea.appendChild(createEmptyState());
}

// ===== DOM helpers =====
function createEmptyState() {
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.id = 'emptyState';
  el.innerHTML = `
    <div class="empty-logo">F</div>
    <h2>What can I help with?</h2>
    <p class="tagline">I can run commands, manage your system, control your desktop, search the web, and delegate complex tasks to cloud AI.</p>
    <div class="quick-chips">
      <button class="quick-chip" onclick="quickSend('What is my disk space?')">
        <span class="chip-icon">&#x1F4BE;</span> Disk space
      </button>
      <button class="quick-chip" onclick="quickSend('Show my GPU temperature')">
        <span class="chip-icon">&#x1F321;</span> GPU temp
      </button>
      <button class="quick-chip" onclick="quickSend('Take a screenshot')">
        <span class="chip-icon">&#x1F4F8;</span> Screenshot
      </button>
      <button class="quick-chip" onclick="quickSend('What is my IP address?')">
        <span class="chip-icon">&#x1F310;</span> My IP
      </button>
      <button class="quick-chip" onclick="quickSend('Set brightness to 50%')">
        <span class="chip-icon">&#x2600;</span> Brightness
      </button>
      <button class="quick-chip" onclick="quickSend('Search the web for latest Arch Linux news')">
        <span class="chip-icon">&#x1F50D;</span> Web search
      </button>
    </div>`;
  return el;
}

function addMessageToDOM(text, role, provider, timestamp, animate = true) {
  const group = document.createElement('div');
  group.className = `msg-group ${role}`;
  if (!animate) group.style.animation = 'none';

  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${role === 'friday' ? 'friday-av' : 'user-av'}`;
  avatar.textContent = role === 'friday' ? 'F' : 'U';

  const content = document.createElement('div');
  content.className = 'msg-content';

  // Meta row with timestamp and provider
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  let metaHTML = `<span>${time}</span>`;
  if (provider && role === 'friday') {
    metaHTML += `<span class="provider-tag">${escapeHtml(provider)}</span>`;
  }
  meta.innerHTML = metaHTML;
  content.appendChild(meta);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(text);
  content.appendChild(bubble);

  group.appendChild(avatar);
  group.appendChild(content);
  chatArea.appendChild(group);

  // Bind copy buttons
  bubble.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.closest('pre').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.querySelector('.copy-label').textContent = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.querySelector('.copy-label').textContent = 'Copy';
        }, 2000);
      });
    });
  });

  scrollToBottom();
}

function addThinking() {
  const group = document.createElement('div');
  group.className = 'thinking-group';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar friday-av';
  avatar.textContent = 'F';

  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  group.appendChild(avatar);
  group.appendChild(dots);
  chatArea.appendChild(group);
  return group;
}

// ===== Markdown renderer =====
function renderMarkdown(text) {
  if (!text) return '';

  // Protect code blocks first — extract them
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const idx = codeBlocks.length;
    const langLabel = lang || 'code';
    const header = `<div class="code-header"><span class="code-lang">${escapeHtml(langLabel)}</span><button class="copy-btn"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span class="copy-label">Copy</span></button></div>`;
    codeBlocks.push(`<pre>${header}<code>${escapeHtml(code.trim())}</code></pre>`);
    return `%%CODEBLOCK_${idx}%%`;
  });

  // Headers
  text = text.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  text = text.replace(/^---$/gm, '<hr>');

  // Blockquote
  text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic
  text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

  // Inline code (after code blocks extracted)
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Unordered lists
  text = text.replace(/^[*\-] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Ordered lists
  text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Line breaks
  text = text.replace(/\n/g, '<br>');

  // Restore code blocks
  codeBlocks.forEach((block, idx) => {
    text = text.replace(`%%CODEBLOCK_${idx}%%`, block);
  });

  // Clean up br around block elements
  text = text.replace(/<br>\s*(<\/?(?:h[1-4]|hr|ul|ol|li|pre|blockquote|div))/g, '$1');
  text = text.replace(/(<\/(?:h[1-4]|hr|ul|ol|li|pre|blockquote|div)>)\s*<br>/g, '$1');

  return text;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

// ===== Start =====
init();
</script>
</body>
</html>
