<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f14;
    --surface: #16161e;
    --surface2: #1c1c28;
    --surface3: #22223a;
    --text: #e0e0f0;
    --text-dim: #6b6b8a;
    --text-muted: #44445a;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.15);
    --accent-dim: #6d28d9;
    --user-bubble: #1e1b4b;
    --friday-bubble: #16161e;
    --border: #2a2a3e;
    --danger: #ef4444;
    --success: #22c55e;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    backdrop-filter: blur(10px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .friday-avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: white;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .header-info h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .header-info .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
  }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .clear-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    padding: 6px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .clear-btn:hover { color: var(--text); border-color: var(--text-dim); }

  /* ---- Chat ---- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* Message group */
  .msg-group {
    display: flex;
    gap: 10px;
    animation: slideIn 0.25s ease;
    max-width: 780px;
  }

  .msg-group.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-group.friday {
    align-self: flex-start;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Avatar */
  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }

  .msg-avatar.friday-av {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: white;
  }

  .msg-avatar.user-av {
    background: var(--surface3);
    color: var(--text-dim);
  }

  /* Bubble */
  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .msg-meta {
    font-size: 10px;
    color: var(--text-muted);
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .msg-meta .provider-tag {
    background: var(--surface3);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .bubble {
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.7;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .msg-group.user .bubble {
    background: var(--user-bubble);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    color: var(--text);
    border: 1px solid rgba(139, 92, 246, 0.2);
  }

  .msg-group.friday .bubble {
    background: var(--friday-bubble);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    border: 1px solid var(--border);
  }

  /* Markdown in bubbles */
  .bubble pre {
    background: var(--bg);
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    margin: 10px 0;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    line-height: 1.5;
  }

  .bubble code {
    background: var(--surface3);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
  }

  .bubble pre code {
    background: none;
    padding: 0;
    color: var(--text);
  }

  .bubble strong { color: #fff; }
  .bubble h1, .bubble h2, .bubble h3 {
    color: #fff;
    margin: 12px 0 6px;
    font-size: 15px;
  }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* Thinking */
  .thinking-group {
    display: flex;
    gap: 10px;
    align-self: flex-start;
    animation: slideIn 0.25s ease;
  }

  .thinking-dots {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: var(--friday-bubble);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
  }

  .thinking-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.4s infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ---- Input ---- */
  .input-area {
    padding: 16px 24px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-container {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 4px 4px 16px;
    transition: border-color 0.2s;
  }

  .input-container:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .input-container textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 0;
    font-size: 14px;
    font-family: 'Inter', system-ui, sans-serif;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 120px;
    line-height: 1.5;
  }

  .input-container textarea::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: white;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--accent-dim); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .send-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: white;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---- Empty state ---- */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 16px;
    padding: 60px 40px;
    text-align: center;
  }

  .empty-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: white;
    box-shadow: 0 0 40px var(--accent-glow);
  }

  .empty-state h2 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-state p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.7;
    max-width: 400px;
  }

  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .quick-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .quick-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-glow); }

  /* ---- Scrollbar ---- */
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="friday-avatar">F</div>
    <div class="header-info">
      <h1>Friday</h1>
      <div class="subtitle">AI System Assistant</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">connecting...</span>
    </div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </div>
</div>

<div class="chat" id="chat">
  <div class="empty-state" id="emptyState">
    <div class="empty-logo">F</div>
    <h2>What can I help with?</h2>
    <p>I can run commands, manage your system, control your desktop, search the web, and delegate complex tasks to cloud AI.</p>
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('what is my disk space?')">Disk space</button>
      <button class="quick-btn" onclick="quickSend('show my GPU temperature')">GPU temp</button>
      <button class="quick-btn" onclick="quickSend('take a screenshot')">Screenshot</button>
      <button class="quick-btn" onclick="quickSend('what is my IP address?')">My IP</button>
      <button class="quick-btn" onclick="quickSend('set brightness to 50%')">Brightness</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-container">
    <textarea id="input" placeholder="Ask Friday anything..." rows="1" autofocus></textarea>
    <button class="send-btn" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
  </div>
</div>

<script>
const API = `http://${location.hostname}:65535`;
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

let sending = false;

// Auto-resize
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearChat(); }
});

sendBtn.addEventListener('click', send);

checkHealth();
setInterval(checkHealth, 30000);

function quickSend(text) {
  input.value = text;
  send();
}

function clearChat() {
  chat.innerHTML = '';
  chat.appendChild(createEmptyState());
}

function createEmptyState() {
  const el = document.createElement('div');
  el.className = 'empty-state';
  el.id = 'emptyState';
  el.innerHTML = `
    <div class="empty-logo">F</div>
    <h2>What can I help with?</h2>
    <p>I can run commands, manage your system, control your desktop, search the web, and delegate complex tasks to cloud AI.</p>
    <div class="quick-actions">
      <button class="quick-btn" onclick="quickSend('what is my disk space?')">Disk space</button>
      <button class="quick-btn" onclick="quickSend('show my GPU temperature')">GPU temp</button>
      <button class="quick-btn" onclick="quickSend('take a screenshot')">Screenshot</button>
      <button class="quick-btn" onclick="quickSend('what is my IP address?')">My IP</button>
    </div>`;
  return el;
}

async function checkHealth() {
  try {
    const res = await fetch(`${API}/health`);
    const data = await res.json();
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = `online · ${data.providers.length} providers`;
  } catch {
    document.getElementById('statusDot').className = 'status-dot offline';
    document.getElementById('statusText').textContent = 'offline';
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;

  const es = document.getElementById('emptyState');
  if (es) es.remove();

  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';

  const thinking = addThinking();
  scrollToBottom();

  sending = true;
  sendBtn.disabled = true;

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    thinking.remove();
    addMessage(data.response, 'friday', data.provider);
  } catch (err) {
    thinking.remove();
    addMessage(`Connection error: ${err.message}`, 'friday', 'error');
  } finally {
    sending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

function addMessage(text, role, provider = '') {
  const group = document.createElement('div');
  group.className = `msg-group ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${role === 'friday' ? 'friday-av' : 'user-av'}`;
  avatar.textContent = role === 'friday' ? 'F' : 'U';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (provider) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.innerHTML = `<span>${time}</span><span class="provider-tag">${provider}</span>`;
    content.appendChild(meta);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(text);
  content.appendChild(bubble);

  group.appendChild(avatar);
  group.appendChild(content);
  chat.appendChild(group);
  scrollToBottom();
}

function addThinking() {
  const group = document.createElement('div');
  group.className = 'thinking-group';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar friday-av';
  avatar.textContent = 'F';

  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  group.appendChild(avatar);
  group.appendChild(dots);
  chat.appendChild(group);
  return group;
}

function renderMarkdown(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
  });
  // Headers
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Horizontal rule
  text = text.replace(/^---$/gm, '<hr>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Unordered lists
  text = text.replace(/^[*-] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Line breaks (but not inside pre/code)
  text = text.replace(/\n/g, '<br>');
  // Clean up extra br in pre blocks
  text = text.replace(/<pre>([\s\S]*?)<\/pre>/g, (match) => {
    return match.replace(/<br>/g, '\n');
  });
  return text;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function scrollToBottom() {
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}
</script>
</body>
</html>
