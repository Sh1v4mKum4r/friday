[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai"
version = "0.1.0"
description = "Friday AI assistant — modular, provider-agnostic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
google = ["google-genai"]
anthropic = ["anthropic"]
openai = ["openai"]
all-providers = ["google-genai", "anthropic", "openai"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
tui = [
    "textual>=1.0.0",
]
stream = [
    "sse-starlette>=2.0.0",
]

[project.scripts]
friday-tui = "friday_ai.tui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["friday_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
